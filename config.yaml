# 美股近一週波動分析與每日推薦標的設定檔 (US Stock Weekly Volatility & Daily Picks Config)

schedule:
  timezone: "Asia/Taipei"
  morning_push_time: "07:00" # 回報前晚美股表現總覽
  evening_push_time: "21:00" # 參考早晨盤後及當晚盤前數據，推薦標的

# 1. 大盤核心指數與跨資產風險指標
market_indices:
  SPY: "標普500 (S&P 500)"
  QQQ: "那斯達克100 (Nasdaq 100)"
  DIA: "道瓊工業 (Dow Jones)"
  IWM: "羅素2000小型股 (Russell 2000)"
  SOXX: "費城半導體 (SOXX)"

macro_indicators:
  "^VIX": "VIX 恐慌指數"
  "^TNX": "10年期美債殖利率"
  "GLD": "黃金 ETF (GLD)"
  "BTC-USD": "比特幣 (BTC)"

# 2. SPDR 11 大產業板塊 ETF
sector_etfs:
  XLK: "科技 (Tech)"
  XLC: "通訊服務 (Comm)"
  XLY: "非必需消費 (Cons Disc)"
  XLF: "金融 (Financials)"
  XLV: "醫療保健 (Healthcare)"
  XLI: "工業 (Industrials)"
  XLP: "必需消費 (Cons Staples)"
  XLE: "能源 (Energy)"
  XLU: "公用事業 (Utilities)"
  XLRE: "房地產 (Real Estate)"
  XLB: "原物料 (Materials)"

# 3. 推薦交易標的選股池 (美股熱門大型股 + 科技巨頭 + 動能焦點股，依板塊分類)
