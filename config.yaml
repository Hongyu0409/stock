# 4. 量化策略與風控參數
strategy_params:
  top_picks_per_category: 3       # 每個策略類別最多推薦幾檔標的
  top_volatility_alerts: 5        # 近一週波動異常放大排行顯示幾檔
  atr_period: 14                  # ATR 計算週期
  rsi_period: 14                  # RSI 計算週期
  stop_loss_atr_mult: 1.5         # 動態停損倍數 (1.5x ATR)
  take_profit_t1_atr_mult: 2.0    # 第一目標停利倍數 (2.0x ATR)
  take_profit_t2_atr_mult: 3.0    # 第二目標停利倍數 (3.0x ATR，風報比 1:2)

# 5. LINE 推播設定
line_notification:
  message_mode: "both"            # 可選 "flex" (精美卡片), "text" (純文字戰報), 或 "both"

# 6. Telegram Bot 推播設定
telegram_notification:
  enabled: true                   # 啟用 Telegram 機器人推播
