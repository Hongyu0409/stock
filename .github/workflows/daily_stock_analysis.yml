name: Daily US Stock Analysis & Push (07:00 Morning & 21:00 Premarket)

on:
  schedule:
    # 雙時段排程保險機制（自動防重複推播，每時段各成功推播一次）：
    # 1. 晨報 (07:00 台灣時間 / UTC 23:00)：回報前晚美股表現總覽
    - cron: "0 23 * * *"
    - cron: "10 23 * * *" # 07:10 備援
    # 2. 盤前推薦報 (21:00 台灣時間 / UTC 13:00)：參考早晨盤後及當晚盤前數據，推薦標的
    - cron: "0 13 * * *"
    - cron: "10 13 * * *" # 21:10 備援
  workflow_dispatch:
    inputs:
      report_type:
        description: "推播類型 (auto: 自動依當前時間判定 / morning: 07:00晨報 / evening: 21:00盤前推薦 / all: 全部)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening
          - all
      message_mode:
        description: "LINE 推播格式 (both: 輪播卡片+文字 / flex: 僅卡片 / text: 僅文字)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - flex
          - text
      use_demo:
        description: "是否使用模擬測試資料 (true/false)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [daily_push, morning_push, evening_push]

permissions:
  contents: read
  actions: read

jobs:
  analyze-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check if current slot scheduled push already succeeded
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name != "schedule":
              print(f"Trigger event: {event_name} -> proceeding with push.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=false\n")
              raise SystemExit(0)

          tz_tw = ZoneInfo("Asia/Taipei")
          now_tw = datetime.now(tz_tw)
          today_tw = now_tw.strftime("%Y-%m-%d")
          cur_slot = "morning" if 4 <= now_tw.hour < 15 else "evening"
          slot_tag = f"{today_tw}_{cur_slot}"

          repo = os.environ["REPO"]
          cur_id = str(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          url = f"https://api.github.com/repos/{repo}/actions/runs?event=schedule&status=success&per_page=15"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          })
          skip = "false"
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
              for r in data.get("workflow_runs", []):
                  if str(r.get("id")) == cur_id:
                      continue
                  if r.get("conclusion") == "success":
                      created_utc = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                      c_tw = created_utc.astimezone(tz_tw)
                      c_date = c_tw.strftime("%Y-%m-%d")
                      c_slot = "morning" if 4 <= c_tw.hour < 15 else "evening"
                      c_tag = f"{c_date}_{c_slot}"
                      if c_tag == slot_tag:
                          print(f"Slot {slot_tag} scheduled push already succeeded in run {r['id']}. Skipping duplicate backup run.")
                          skip = "true"
                          break
          except Exception as e:
              print(f"Warning: could not check previous runs ({e}), proceeding with push.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={skip}\n")
          EOF

      - name: Checkout repository
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US Stock Volatility Analysis & Push (LINE & Telegram)
        if: steps.dedup.outputs.skip != 'true'
        env:
          TZ: Asia/Taipei
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_MESSAGE_MODE: ${{ inputs.message_mode || 'both' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.use_demo }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --demo"
          fi
          REPORT_TYPE="${{ inputs.report_type || 'auto' }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "morning_push" ]; then
              REPORT_TYPE="morning"
            elif [ "${{ github.event.action }}" = "evening_push" ]; then
              REPORT_TYPE="evening"
            fi
          fi
          python main.py --report-type "$REPORT_TYPE" $EXTRA_ARGS

      - name: Upload Daily Analysis Report Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.dedup.outputs.skip != 'true'
        with:
          name: us-stock-daily-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
