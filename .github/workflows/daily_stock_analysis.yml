name: Daily 08:00 US Stock Volatility & Trading Picks Push

on:
  schedule:
    # 三重排程保險機制（自動防重複推播，每天只會推播成功一次）：
    # 1. 主排程：UTC 23:50 (台灣時間 07:50) 避開整點全球佇列尖峰
    - cron: "50 23 * * *"
    # 2. 第一備援：UTC 00:00 (台灣時間 08:00) 若主排程被 GitHub 漏觸發則自動補發
    - cron: "0 0 * * *"
    # 3. 第二備援：UTC 00:15 (台灣時間 08:15) 確保萬無一失
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      message_mode:
        description: "LINE 推播格式 (both: 輪播卡片+文字 / flex: 僅卡片 / text: 僅文字)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - flex
          - text
      use_demo:
        description: "是否使用模擬測試資料 (true/false)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [daily_push]

permissions:
  contents: read
  actions: read

jobs:
  analyze-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check if today's scheduled push already succeeded
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name != "schedule":
              print("Manual trigger (workflow_dispatch) -> proceeding with push.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=false\n")
              raise SystemExit(0)

          tz_tw = ZoneInfo("Asia/Taipei")
          today_tw = datetime.now(tz_tw).strftime("%Y-%m-%d")
          repo = os.environ["REPO"]
          cur_id = str(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          url = f"https://api.github.com/repos/{repo}/actions/runs?event=schedule&status=success&per_page=10"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          })
          skip = "false"
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
              for r in data.get("workflow_runs", []):
                  if str(r.get("id")) == cur_id:
                      continue
                  if r.get("conclusion") == "success":
                      created_utc = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                      created_tw = created_utc.astimezone(tz_tw).strftime("%Y-%m-%d")
                      if created_tw == today_tw:
                          print(f"Today ({today_tw}) scheduled push already succeeded in run {r['id']}. Skipping duplicate backup run.")
                          skip = "true"
                          break
          except Exception as e:
              print(f"Warning: could not check previous runs ({e}), proceeding with push.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={skip}\n")
          EOF

      - name: Checkout repository
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US Stock Weekly Volatility Analysis & LINE Push
        if: steps.dedup.outputs.skip != 'true'
        env:
          TZ: Asia/Taipei
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_MESSAGE_MODE: ${{ inputs.message_mode || 'both' }}
        run: |
          if [ "${{ inputs.use_demo }}" = "true" ]; then
            python main.py --demo
          else
            python main.py
          fi

      - name: Upload Daily Analysis Report Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.dedup.outputs.skip != 'true'
        with:
          name: us-stock-daily-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
